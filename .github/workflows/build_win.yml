name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: cmd
        
    steps:
    - uses: actions/checkout@v7
    
    - name: configure
      run: msbuild.exe api-ms-win-core-path-blender.sln /p:Configuration=Release /p:Platform=x64

    - name: List dir
      run: dir /S ${{github.workspace}}
